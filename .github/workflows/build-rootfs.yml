name: Build rootfs_128m.ext4

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 强制使用 Node.js 24，消除弃用警告
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Grant execute permission
        run: chmod +x ./build-rootfs.sh

      - name: Build rootfs image
        run: ./build-rootfs.sh

      - name: Upload rootfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: rootfs_128m
          path: build/rootfs_128m.ext4
          retention-days: 30
