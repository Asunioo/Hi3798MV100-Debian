name: Build cgroupfs-mount for Debian 13

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-debian-13:
    runs-on: ubuntu-latest
    
    # 使用官方的 Debian 13 (trixie) 容器作为构建环境
    container:
      image: debian:trixie
      
    steps:
      # 1. 检出当前仓库的代码（如果您需要修改源码，这一步是必须的）
      - name: Checkout repository
        uses: actions/checkout@v4
        
      # 2. 更新软件源、启用 deb-src 并安装必要的构建工具链
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            devscripts \
            dpkg-dev \
            fakeroot \
            debhelper
            
      # 3. 获取源码、安装项目依赖并进行编译打包
      - name: Build Debian package
        run: |
          # 追加 Debian 13 (trixie) 的官方源码仓库地址并更新索引
          echo "deb-src http://deb.debian.org/debian trixie main" >> /etc/apt/sources.list.d/debian-src.list
          apt-get update
          
          # 下载 cgroupfs-mount 官方源码包（会自动解压到当前目录）
          apt-get source cgroupfs-mount
          
          # 自动安装该源码包的编译依赖
          apt-get build-dep -y cgroupfs-mount
          
          # 进入生成的源码目录
          cd cgroupfs-mount-*
          
          # 执行本地编译打包（跳过 GPG 签名步骤）
          debuild -us -uc -b
          
      # 4. 将编译生成的 .deb 安装包作为 Artifact 上传保存
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cgroupfs-mount-deb
          path: ../*.deb
